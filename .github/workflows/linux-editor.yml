name: Locked Linux editor

on:
  pull_request:
    paths:
      - '.github/workflows/linux-editor.yml'
      - 'customizations/scripts/build-linux-editor.py'
      - 'customizations/scripts/probe-linux-editor.gd'
      - 'customizations/scripts/probe-linux-import.py'
      - 'customizations/scripts/initialize-engine.ps1'
      - 'customizations/scripts/verify-stack.ps1'
      - 'customizations/scripts/lib/PatchStack.Common.ps1'
      - 'customizations/stack.json'
      - 'customizations/stack.lock.json'
      - 'customizations/series.txt'
      - 'customizations/personal-history.bundle'
      - 'customizations/patches/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-editor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      EXPECTED_ENGINE_COMMIT: 38b6ddee72e16d9d646057ee6ba533c122afc47c
      EXPECTED_UPSTREAM_COMMIT: 5ec4857b340b6284a18b49b2eda462bd250f219a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore and verify exact engine history
        shell: pwsh
        run: |
          $lock = Get-Content customizations/stack.lock.json -Raw | ConvertFrom-Json
          if ($lock.integration.commit -ne $env:EXPECTED_ENGINE_COMMIT -or $lock.upstream.commit -ne $env:EXPECTED_UPSTREAM_COMMIT) {
            throw 'The catalog differs from the reviewed engine identity.'
          }
          & ./customizations/scripts/initialize-engine.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./customizations/scripts/verify-stack.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install isolated locked build dependency
        shell: bash
        run: |
          python3 -m venv .linux-build-venv
          printf '%s\n' 'SCons==4.10.1 --hash=sha256:bd9d1c52f908d874eba92a8c0c0a8dcf2ed9f3b88ab956d0fce1da479c4e7126' > .linux-build-venv/requirements.txt
          .linux-build-venv/bin/python -m pip --isolated install --disable-pip-version-check \
            --index-url https://pypi.org/simple --only-binary=:all: --require-hashes \
            -r .linux-build-venv/requirements.txt
      - name: Build and identify Linux editor
        shell: bash
        run: |
          .linux-build-venv/bin/python customizations/scripts/build-linux-editor.py \
            --engine engine --output linux-editor-artifact --jobs 2 \
            --expected-commit "$EXPECTED_ENGINE_COMMIT"
      - name: Check bounded empty editor import
        shell: bash
        run: python3 customizations/scripts/probe-linux-import.py --artifact linux-editor-artifact
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-editor-evidence-${{ github.run_id }}
          path: |
            linux-editor-artifact/*.log
            linux-editor-artifact/empty-import-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified editor archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midot-linux-x86_64-${{ env.EXPECTED_ENGINE_COMMIT }}
          path: linux-editor-artifact/midot-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
