name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Secrets and Actions audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      report_artifact_id: ${{ steps.report.outputs.artifact-id }}
    steps:
      - name: Check out the scanned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check runner behavior with real scanner fixtures
        env:
          MIDOT_SECURITY_TOOLS: ${{ runner.temp }}/midot-security-tools
        run: python3 -m unittest discover -s scripts/security -p 'test_*.py' -v
      - name: Scan tracked text, patches and Actions definitions
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/security/run_checks.py
          --tools-dir "$RUNNER_TEMP/midot-security-tools"
          --output "$RUNNER_TEMP/midot-security-report"
          --mode advisory
      - name: Retain sanitized report
        id: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-report
          path: ${{ runner.temp }}/midot-security-report/*.json
          if-no-files-found: error
          retention-days: 14

  track-advisory:
    name: Track main-branch findings separately
    needs: scan
    if: ${{ needs.scan.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out trusted tracking code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read this run's sanitized report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: security-report
          path: ${{ runner.temp }}/midot-security-report
      - name: Maintain a separate advisory issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_ARTIFACT_ID: ${{ needs.scan.outputs.report_artifact_id }}
        run: >-
          python3 scripts/security/track_issue.py
          --report "$RUNNER_TEMP/midot-security-report/summary.json"
          --artifact-id "$REPORT_ARTIFACT_ID"
