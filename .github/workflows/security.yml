name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Secrets and Actions audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the scanned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check runner behavior with real scanner fixtures
        env:
          MIDOT_SECURITY_TOOLS: ${{ runner.temp }}/midot-security-tools
        run: python3 -m unittest discover -s scripts/security -p test_checks.py -v
      - name: Scan tracked text, patches and Actions definitions
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/security/run_checks.py
          --tools-dir "$RUNNER_TEMP/midot-security-tools"
          --output "$RUNNER_TEMP/midot-security-report"
      - name: Retain sanitized report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-report
          path: ${{ runner.temp }}/midot-security-report/*.json
          if-no-files-found: error
          retention-days: 14
