name: Diagnostic Linux editor

on:
  pull_request:
    paths:
      - '.github/workflows/linux-diagnostic.yml'
      - 'customizations/scripts/build-linux-diagnostic.py'
      - 'customizations/tests/test_linux_build_cache.py'
      - 'customizations/tests/test_scons_cache.py'
  # PR caches are scoped to their PR. Main builds seed a cache new PRs can read.
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-diagnostic.yml'
      - 'customizations/scripts/build-linux-diagnostic.py'
      - 'customizations/tests/test_linux_build_cache.py'
      - 'customizations/tests/test_scons_cache.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      EXPECTED_ENGINE_COMMIT: 38b6ddee72e16d9d646057ee6ba533c122afc47c
      EXPECTED_UPSTREAM_COMMIT: 5ec4857b340b6284a18b49b2eda462bd250f219a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check build cache contracts
        run: python3 customizations/tests/test_linux_build_cache.py
      - name: Restore and verify exact engine history
        shell: pwsh
        run: |
          $lock = Get-Content customizations/stack.lock.json -Raw | ConvertFrom-Json
          if ($lock.integration.commit -ne $env:EXPECTED_ENGINE_COMMIT -or $lock.upstream.commit -ne $env:EXPECTED_UPSTREAM_COMMIT) {
            throw 'The catalog differs from the reviewed engine identity.'
          }
          & ./customizations/scripts/initialize-engine.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./customizations/scripts/verify-stack.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Identify compiler cache boundary
        id: compiler
        shell: bash
        run: |
          fingerprint=$( { g++ --version; ld --version; sha256sum "$(command -v g++)" "$(command -v ld)"; } | sha256sum | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      # Cache objects, not acceptance evidence. SCons rechecks source signatures;
      # production and instrumented builds have separate bounded namespaces.
      - name: Cache SCons objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/midot-scons
          key: scons-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('.github/workflows/linux-*.yml', 'customizations/scripts/build-linux-*.py') }}-${{ hashFiles('customizations/stack.lock.json') }}-${{ github.sha }}
          restore-keys: |
            scons-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('.github/workflows/linux-*.yml', 'customizations/scripts/build-linux-*.py') }}-
      - name: Install isolated locked build dependency
        shell: bash
        run: |
          python3 -m venv .linux-build-venv
          printf '%s\n' 'SCons==4.10.1 --hash=sha256:bd9d1c52f908d874eba92a8c0c0a8dcf2ed9f3b88ab956d0fce1da479c4e7126' > .linux-build-venv/requirements.txt
          .linux-build-venv/bin/python -m pip --isolated install --disable-pip-version-check \
            --index-url https://pypi.org/simple --only-binary=:all: --require-hashes \
            -r .linux-build-venv/requirements.txt
      - name: Verify SCons cache retrieval and invalidation
        run: .linux-build-venv/bin/python customizations/tests/test_scons_cache.py
      - name: Build isolated diagnostic editor and bounded import probe
        shell: bash
        run: |
          .linux-build-venv/bin/python customizations/scripts/build-linux-diagnostic.py \
            --engine engine --output linux-diagnostic-artifact --jobs 2 \
            --cache-dir "$RUNNER_TEMP/midot-scons"
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midot-diagnostic-six-markers-${{ github.run_id }}
          path: |
            linux-diagnostic-artifact/*.log
            linux-diagnostic-artifact/*report.json
            linux-diagnostic-artifact/midot-diagnostic-six-markers.tar.gz
          if-no-files-found: error
          retention-days: 7
